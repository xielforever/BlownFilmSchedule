name: Wave 2 Domain Contracts

on:
  push:
    branches:
      - wave2-domain-schema
  pull_request:
    paths:
      - 'db/migrations/20260828_wave2_*'
      - 'data/wave2/**'
      - 'config/wave2_*'
      - 'scripts/*wave2*'
      - 'tests/test_wave2_*'
      - 'docs/medical-blownfilm-wave2-*'
      - '.github/workflows/wave2-domain-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Wave 2 static contracts
        run: |
          python -m unittest \
            tests.test_wave2_domain_schema_contract \
            tests.test_wave2_master_data_population_contract \
            tests.test_wave2_override_candidate_generator_contract \
            tests.test_wave2_benchmark_profile_contract \
            tests.test_wave2_material_identity_contract \
            tests.test_wave2_reservation_audit_contract

      - name: Assert solver remains outside Wave 2 diff
        run: |
          git fetch origin "${{ github.event.repository.default_branch }}"
          if git diff --name-only "origin/${{ github.event.repository.default_branch }}...HEAD" | grep -E '^src/scheduler\.py$'; then
            echo 'Wave 2 must not modify src/scheduler.py'
            exit 1
          fi
